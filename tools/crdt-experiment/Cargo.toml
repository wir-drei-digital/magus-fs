[package]
name = "magus-fs-crdt-experiment"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[workspace]

[dependencies]
automerge = "=0.12.0"
magus-fs-core = { path = "../../crates/magus-fs-core" }
serde = { version = "=1.0.229", features = ["derive"] }
