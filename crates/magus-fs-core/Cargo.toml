[package]
license = "MIT"
name = "magus-fs-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[features]
default = []
test-faults = []

[dependencies]
ureq = { version = "=2.12.1", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
unicode-normalization = "=0.1.25"
caseless = "=0.2.2"
libc = "=0.2.190"
# Three-way text merge only; Err marker text is never canonical output (FS2-B Task 2).
diffy = { version = "=0.5.2", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
