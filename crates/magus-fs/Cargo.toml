[package]
name = "magus-fs"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
[features]
default = []
test-faults = ["magus-fs-core/test-faults"]
[dependencies]
magus-fs-core = { path = "../magus-fs-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.190"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "sync", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking", "json", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "=0.3.32"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
fuser = { version = "=0.18.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nfsserve = "=0.11.0"
async-trait = "=0.1.89"
