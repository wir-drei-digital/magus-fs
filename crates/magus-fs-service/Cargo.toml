[package]
name = "magus-fs-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[features]
default = []
test-faults = []

[dependencies]
magus-fs-core = { path = "../magus-fs-core" }
axum = { version = "=0.8.8", features = ["ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-postgres = "=0.7.18"
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking", "json", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
libc = "=0.2.190"
futures-util = "=0.3.32"
http-body-util = "=0.1.3"

[dev-dependencies]
tempfile = "=3.27.0"
