[package]
license = "MIT"
name = "magus-fs-probe"
version = "0.1.0"
edition = "2021"
autobenches = false
rust-version = "1.88"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "=2.12.1", default-features = false }

axum = "=0.8.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

nfsserve = "=0.11.0"
async-trait = "=0.1.89"
libc = "0.2"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false }

[patch.crates-io]
nfsserve = { path = "vendor/nfsserve-0.11.0" }

[dev-dependencies]
fastcdc = "=5.0.0"

[[example]]
name = "chunk_layout"
path = "benches/chunk_layout.rs"

[workspace]
members = ["crates/magus-fs-core", "crates/magus-fs", "crates/magus-fs-service"]
default-members = [".", "crates/magus-fs-core", "crates/magus-fs"]
resolver = "2"
