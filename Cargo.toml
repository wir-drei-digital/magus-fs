[package]
name = "magus-fs-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "=2.12.1", default-features = false }

axum = "=0.8.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
